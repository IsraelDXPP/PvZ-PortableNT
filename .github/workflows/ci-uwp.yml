# Experimental UWP (Xbox One / Windows 10) build.
#
# Builds the game for the Windows Store (x64) target and, on success,
# packages the staged files into a signed .appx using makeappx + signtool.
# The appx deliberately excludes the copyrighted game data (main.pak and the
# properties/ folder); on Xbox the user seeds those into the app's LocalState
# folder via the device portal file explorer. The signing cert is a persistent
# self-signed dev cert (base64 pfx in the PVZ_UWP_SIGN_PFX secret).
#
# Triggering: run manually (workflow_dispatch) or on any push to main.

name: CI - UWP (Xbox One / Windows 10)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  uwp-x64:
    name: Build UWP (x64)
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_DEFAULT_TRIPLET: x64-uwp
    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC UWP environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          uwp: true

      - name: Get toolchain ID for cache key
        shell: pwsh
        run: |
          $tc = $env:VCToolsVersion
          if (-not $tc) { $tc = "unknown" }
          echo "VCPKG_TC=msvc-uwp-$tc" >> $env:GITHUB_ENV

      - name: Ensure UWP C++ workload
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $xamlTargets = "$vs\MSBuild\Microsoft\WindowsXaml"
          if (-not (Test-Path $xamlTargets)) {
            $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (-not (Test-Path $installer)) { throw "vs_installer not found" }
            & $installer modify --installPath $vs `
              --add Microsoft.VisualStudio.Workload.Universal `
              --quiet --norestart
            if ($LASTEXITCODE -ne 0) { throw "vs_installer modify failed" }
          } else {
            Write-Host "UWP workload already present"
          }

      - name: Install Ninja
        run: choco install ninja -y

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          # Toolset in the key: vcpkg's ABI hash changes when MSVC updates.
          key: vcpkg-uwp-x64-${{ env.VCPKG_TC }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-uwp-x64-${{ env.VCPKG_TC }}-
            vcpkg-uwp-x64-

      - name: Restore UWP build dir (incremental compile)
        uses: actions/cache@v6
        with:
          path: build-uwp
          key: uwp-build-${{ hashFiles('src/**', 'CMakeLists.txt', 'CMake/**', 'uwp/**') }}
          restore-keys: |
            uwp-build-

      - name: Setup vcpkg (manifest mode, x64-uwp triplet)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
          runVcpkgInstall: true
          doNotCache: false

      - name: Configure (WindowsStore / UWP toolchain)
        shell: pwsh
        run: |
          cmake -G Ninja -B build-uwp `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            -DCMAKE_SYSTEM_VERSION=10.0 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCONSOLE=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-uwp
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-uwp --config Release
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-uwp/pvz-portable.exe dist/
          Copy-Item build-uwp/uwp/Package.appxmanifest dist/
          Copy-Item -Recurse uwp/Assets dist/Assets
          # Game + ANGLE DLLs from the vcpkg x64-uwp manifest install (SDL2,
          # jpeg, png, openmpt, libEGL, libGLESv2, ...). The vcpkg toolchain
          # re-installs the manifest into the CMake build dir during
          # configure. UWP apps must ship every non-system DLL next to the exe.
          Copy-Item "build-uwp/vcpkg_installed/x64-uwp/bin/*.dll" dist/
          # UWP CRT runtime DLLs (vcruntime140_app, msvcp140_app, vccorlib140,
          # concrt140_app, ...) from the VC redist onecore app layout.
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $crtNames = @('vcruntime140_app.dll', 'vcruntime140_1_app.dll',
            'msvcp140_app.dll', 'msvcp140_1_app.dll', 'msvcp140_2_app.dll',
            'concrt140_app.dll', 'vccorlib140.dll')
          $crtDlls = @()
          foreach ($n in $crtNames) {
            $f = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Filter $n -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($f) { $crtDlls += $f }
          }
          if (-not $crtDlls) { throw "UWP CRT DLLs not found in VC redist" }
          $crtDlls | ForEach-Object { Copy-Item $_.FullName dist/ }
          if (-not (Get-ChildItem dist -Filter *.dll)) { throw "no DLLs staged" }
          # d3dcompiler_47.dll required by ANGLE's D3D11 backend.
          $d3d = "C:\Program Files (x86)\Windows Kits\10\Redist\D3D\x64\d3dcompiler_47.dll"
          if (-not (Test-Path $d3d)) { throw "d3dcompiler_47.dll not found in Windows Kits" }
          Copy-Item $d3d dist/
          Get-ChildItem dist | Sort-Object Name | Select-Object Name, Length

      - name: Build and sign AppX
        shell: pwsh
        env:
          PVZ_UWP_SIGN_PFX: ${{ secrets.PVZ_UWP_SIGN_PFX }}
          PVZ_UWP_SIGN_PASS: ${{ secrets.PVZ_UWP_SIGN_PASS }}
        run: |
          $sdk = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $sdk -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $signtool = Get-ChildItem $sdk -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeappx -or -not $signtool) { throw "Windows SDK bin tools not found" }

          # Package layout: the manifest must be named AppxManifest.xml.
          $appxDir = "appx"
          New-Item -ItemType Directory -Force -Path $appxDir | Out-Null
          Copy-Item dist/* $appxDir/ -Recurse
          Move-Item "$appxDir/Package.appxmanifest" "$appxDir/AppxManifest.xml" -Force

          [xml]$m = Get-Content "$appxDir/AppxManifest.xml"
          $pkgName = $m.Package.Identity.Name
          $pkgVer = $m.Package.Identity.Version
          $appxFile = "$appxDir/${pkgName}_${pkgVer}_x64.appx"

          & $makeappx.FullName pack /d $appxDir /p $appxFile /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }

          # Sign with the persistent dev certificate. Its subject must match
          # the manifest <Identity Publisher>. Repo secret holds the base64
          # pfx; without it a throwaway cert is used (unsigned-provenance build).
          $pfxPass = $env:PVZ_UWP_SIGN_PASS
          if (-not $env:PVZ_UWP_SIGN_PFX) {
            Write-Host "No PVZ_UWP_SIGN_PFX secret: generating a throwaway self-signed cert."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$pkgName" -CertStoreLocation Cert:\CurrentUser\My
            $pfxPass = [Guid]::NewGuid().ToString("N")
            $sec = ConvertTo-SecureString -String $pfxPass -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath sign.pfx -Password $sec -Force | Out-Null
          } else {
            [IO.File]::WriteAllBytes("sign.pfx", [Convert]::FromBase64String($env:PVZ_UWP_SIGN_PFX))
          }
          & $signtool.FullName sign /f sign.pfx /p $pfxPass /fd SHA256 /a $appxFile
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          Copy-Item uwp/certs/PvZPortableDev.cer $appxDir/
          Get-ChildItem $appxDir | Sort-Object Name | Select-Object Name, Length

      - name: Upload UWP build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pvz-portable-uwp-x64
          path: dist/
          if-no-files-found: error

      - name: Upload signed AppX
        uses: actions/upload-artifact@v7
        with:
          name: pvz-portable-uwp-appx
          path: appx/
          if-no-files-found: error
